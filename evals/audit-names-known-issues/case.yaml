schema_version: "1.1"
name: audit-names-known-issues
description: /not-vibing:audit on a seeded repo names status kept in several places, a stale STATUS, and a decision resting on a tier-3 number, and changes nothing
tags: [needs-bash]
runs: 2
execution:
  prompt: "/not-vibing:audit"
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
context:
  scaffold_script: scaffold.sh
graders:
  - name: several-homes
    type: llm
    criteria: >-
      The report says that the same step or status is written in several places (for example
      STATUS.md, PLAN.md, PARKED.md, next-steps.md, the weekly notes) and recommends one home.
  - name: tier-3-decision
    type: llm
    criteria: >-
      The report says that the decision in docs/adr/0001-generator-b.md rests on a number that
      was never checked against what users keep (a tier-3 proxy, the model judge's agreement),
      and ranks it among its most important findings.
  - name: read-only
    type: tool_used
    tool: Write
    min: 0
    max: 0
